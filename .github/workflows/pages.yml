name: Build and publish to gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only contents:write is needed: this pushes the built site to a branch rather than using the
# github-pages deployment environment, which restricts deploys to the repository's default branch.
permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` runs the prepare script, which copies the ONNX Runtime WASM into public/ort.
      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # dist/ becomes its own single-commit repository and is force-pushed, so gh-pages only ever
      # holds the current build. dist/.nojekyll stops Pages running Jekyll over the underscore paths.
      - name: Publish dist/ to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/.nojekyll
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          echo "publishing $(git diff --cached --name-only | wc -l) files"
          git commit -q -m "Built site from ${GITHUB_SHA:0:7}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
