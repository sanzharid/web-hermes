name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but let a queued one finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` runs the prepare script, which copies the ONNX Runtime WASM into public/ort.
      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # enablement: true turns Pages on via the API if it has never been enabled, so the first
      # run does not need the Settings toggle flipped by hand.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # GitHub Pages cannot set COOP/COEP response headers. The app's service worker adds them
      # itself and reloads once on a first visit, which the offline audit verifies.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
