name: Deploy to Cloudflare Pages

# Manual only. Cloudflare Pages needs a working billing account, and without the two secrets
# below every push would fail this workflow. Add `push: {branches: [main]}` back once the
# Cloudflare side is sorted, and drop the GitHub Pages workflow if you want a single target.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` runs the prepare script, which copies the ONNX Runtime WASM into public/ort.
      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # Deploys dist/ as-is. dist/_headers carries the COOP/COEP headers that the app needs for
      # SharedArrayBuffer (multi-threaded WASM inference); Pages serves that file automatically.
      - name: Deploy
        run: npx --yes wrangler@4 pages deploy dist --project-name=sift --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
